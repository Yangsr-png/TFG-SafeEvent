version: '3.8'

services:
  postgres:
    image: postgis/postgis:15-3.3
    container_name: safeevent-postgres
    restart: always
    environment:
      # POSTGRES_PASSWORD es la clave universal
      POSTGRES_USER: safeuser
      POSTGRES_PASSWORD: safepassword 
      POSTGRES_DB: safeevent_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: safeevent-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

volumes:
  postgres_data:
  redis_data: